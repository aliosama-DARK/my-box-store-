<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل دخول الأدمن — MY BOX STORE</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="../images/logo.jpeg" />
  <script>
    (function () {
      try {
        var q=(location.search.match(/[?&]theme=(dark|light)/)||[])[1];
        var t = q || localStorage.getItem("mbs_theme");
        if(q) localStorage.setItem("mbs_theme",q);
        if (t !== "light" && t !== "dark")
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
    })();
  </script>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>

  <div class="login-page">
    <div class="login-card">
      <img src="../images/logo.jpeg" alt="MY BOX STORE" class="logo-img" />
      <h1>لوحة تحكم MY BOX STORE</h1>
      <p class="sub">سجّل الدخول لإدارة الطلبات</p>

      <div class="login-error" id="loginError"></div>

      <form id="loginForm" autocomplete="off">
        <div class="form-group">
          <label for="username">البريد الإلكتروني</label>
          <input type="email" id="username" name="username" required autocomplete="username" placeholder="admin@example.com" />
        </div>
        <div class="form-group">
          <label for="password">كلمة السر</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••" />
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn">دخول 🔐</button>
      </form>

      <a href="../index.html" class="back-link">← الرجوع للمتجر</a>
    </div>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const errBox = document.getElementById("loginError");
    const btn = document.getElementById("loginBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errBox.classList.remove("show");
      btn.disabled = true;
      btn.textContent = "جارٍ الدخول...";
      try {
        const res = await fetch("/api/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value,
          }),
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          location.href = "dashboard.html";
          return;
        }
        errBox.textContent = data.error || "تعذّر تسجيل الدخول";
        errBox.classList.add("show");
      } catch {
        errBox.textContent = "تعذّر الاتصال بالسيرفر — تأكد أن الموقع يعمل عبر node server.js";
        errBox.classList.add("show");
      }
      btn.disabled = false;
      btn.textContent = "دخول 🔐";
    });
  </script>
</body>
</html>
